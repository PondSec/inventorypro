# Validation only. No registry push, release publication or deployment.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
    - when: never

stages:
  - test

variables:
  GIT_DEPTH: "0"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  QA_ARTIFACT_DIR: "$CI_PROJECT_DIR/.qa-artifacts/screenshots"

regression:
  tags:
    - inventorypro-test
  stage: test
  image: python:3.12-bookworm
  timeout: 20 minutes
  # Complete an already running regression despite the required frequent dev pushes.
  interruptible: false
  cache:
    key:
      files:
        - requirements.lock
        - requirements-dev.lock
    paths:
      - .cache/pip/
      - .cache/ms-playwright/
  before_script:
    - python -m pip install --disable-pip-version-check -r requirements-dev.lock
    - python -m playwright install --with-deps chromium firefox
  script:
    - python scripts/check_gitlab_registry.py
    - mkdir -p .qa-artifacts
    - python -m pytest -q --junitxml=.qa-artifacts/junit.xml
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: .qa-artifacts/junit.xml
    paths:
      - .qa-artifacts/
