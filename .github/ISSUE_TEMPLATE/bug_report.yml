name: Bug report
description: Report a reproducible defect without sensitive data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, customer data or security details. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Inventory Pro version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
