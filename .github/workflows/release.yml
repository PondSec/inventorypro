name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/pondsec/inventorypro

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Inventory Pro $TAG" \
            --notes-file RELEASE_NOTES.md \
          || gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Inventory Pro $TAG" \
            --notes-file RELEASE_NOTES.md

      - name: Upload install files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cp packaging/docker/env.example inventorypro.env.example
          gh release upload "$TAG" \
            INSTALL_DOCKER.md \
            docker-compose.ghcr.yml \
            inventorypro.env.example \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${TAG}" \
            -t "${IMAGE_NAME}:${TAG}" \
            -t "${IMAGE_NAME}:latest" \
            .

      - name: Smoke test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker rm -f inventorypro-smoke >/dev/null 2>&1 || true
          docker run -d --name inventorypro-smoke -e APP_SECRET_KEY=smoke-test-secret "${IMAGE_NAME}:${TAG}"
          for i in $(seq 1 45); do
            if docker exec inventorypro-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=3).read()" >/dev/null 2>&1; then
              docker rm -f inventorypro-smoke >/dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs inventorypro-smoke
          docker rm -f inventorypro-smoke >/dev/null
          exit 1

      - name: Export image archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker save "${IMAGE_NAME}:${TAG}" | gzip -9 > "inventorypro-docker-image-${TAG}-linux-amd64.tar.gz"
          sha256sum "inventorypro-docker-image-${TAG}-linux-amd64.tar.gz" > "inventorypro-docker-image-${TAG}-linux-amd64.tar.gz.sha256"

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker push "${IMAGE_NAME}:${TAG}"
          docker push "${IMAGE_NAME}:latest"

      - name: Upload Docker archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            "inventorypro-docker-image-${TAG}-linux-amd64.tar.gz" \
            "inventorypro-docker-image-${TAG}-linux-amd64.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: create-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name InventoryPro `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "pondsec_ai;pondsec_ai" `
            --add-data "LICENSE;." `
            --collect-submodules pondsec_ai `
            packaging/windows/inventorypro_launcher.py
          Move-Item dist/InventoryPro.exe "InventoryPro-${{ github.ref_name }}-windows-x64.exe"
          $hash = (Get-FileHash "InventoryPro-${{ github.ref_name }}-windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  InventoryPro-${{ github.ref_name }}-windows-x64.exe" | Out-File -Encoding ascii "InventoryPro-${{ github.ref_name }}-windows-x64.exe.sha256"

      - name: Upload executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "InventoryPro-${{ github.ref_name }}-windows-x64.exe" `
            "InventoryPro-${{ github.ref_name }}-windows-x64.exe.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber
