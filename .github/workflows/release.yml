name: Prepare reviewed GitLab release and legacy update bridge

# Deliberate release request on dev; ordinary application pushes never publish.
on:
  push:
    branches: [dev]
    paths: [.release/request.json]

permissions:
  contents: write
  packages: write

concurrency:
  group: inventorypro-release-dev
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'PondSec/inventorypro'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release request against authoritative GitLab dev
        id: meta
        run: python scripts/validate_release_request.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Regression including Chromium and Firefox
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          python -m playwright install --with-deps chromium firefox
          python -m pytest -q --junitxml=release-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results
          path: release-test-results.xml
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable compatibility image for verified registry promotion
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/pondsec/inventorypro:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://gitlab.pondsec.com/PondSec/inventorypro
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Sign both update feeds using the already shipped key
        env:
          INVENTORY_UPDATE_SIGNING_KEY: ${{ secrets.INVENTORY_UPDATE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python scripts/prepare_update_bridge.py --version "$RELEASE_VERSION" \
            --gitlab-image "gitlab.pondsec.com/pondsec/inventorypro@$IMAGE_DIGEST" \
            --legacy-image "ghcr.io/pondsec/inventorypro@$IMAGE_DIGEST" \
            --output-dir release-artifacts
          mv release-artifacts/update-manifest.json release-artifacts/gitlab-update-manifest.json
          mv release-artifacts/legacy-update-manifest.json release-artifacts/update-manifest.json
          git archive --format=tar.gz --output "release-artifacts/inventorypro-$RELEASE_VERSION.tar.gz" HEAD
      - name: Create draft compatibility release for final acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" --draft --target "$GITHUB_SHA" \
            --title "Inventory Pro v$RELEASE_VERSION" \
            --notes 'GitLab enterprise update. Publication pending image and upgrade acceptance.' \
            release-artifacts/*
