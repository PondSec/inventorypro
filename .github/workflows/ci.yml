name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: inventorypro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Install browser test dependency
        run: python -m playwright install --with-deps firefox
      - name: Run tests and create coverage report
        run: python -m pytest --cov=app --cov=inventorypro --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend assets
        run: pnpm run build:vendor
      - name: Build application image
        run: docker build --build-arg APP_VERSION=ci -t inventorypro:ci .
