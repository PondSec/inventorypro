services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventorypro:latest
    ports:
      - "${INVENTORY_PORT:-5000}:5000"
    environment:
      INVENTORY_HOST: 0.0.0.0
      INVENTORY_PORT: 5000
      INVENTORY_DATABASE_PATH: /data/inventory.db
      INVENTORY_UPLOADS_DIR: /data/uploads
      INVENTORY_INSTANCE_PATH: /data/instance
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      INVENTORY_INITIAL_ADMIN_USERNAME: ${INVENTORY_INITIAL_ADMIN_USERNAME:-}
      INVENTORY_INITIAL_ADMIN_PASSWORD: ${INVENTORY_INITIAL_ADMIN_PASSWORD:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      INVENTORY_LINKS_ENCRYPTION_KEY: ${INVENTORY_LINKS_ENCRYPTION_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - inventorypro-data:/data
    restart: unless-stopped

volumes:
  inventorypro-data:
