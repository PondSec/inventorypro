<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>OTP Verifizierung | Inventory Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        async function verifyOTP() {
            const code = document.getElementById("otp").value;
            const output = document.getElementById("result");

            try {
                const response = await fetch("/api/otp/verify", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({ code: code })
                });

                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }

                const result = await response.json();

                if (response.ok && result.verified) {
                    output.textContent = "✅ Verifiziert!";
                    output.className = "text-emerald-600 text-sm font-semibold";
                } else {
                    output.textContent = "❌ Verifizierung fehlgeschlagen!";
                    output.className = "text-rose-600 text-sm font-semibold";
                }
            } catch (err) {
                output.textContent = "⚠️ Fehler: " + err.message;
                output.className = "text-rose-600 text-sm font-semibold";
            }
        }
    </script>
</head>
<body class="min-h-screen bg-slate-950/5 text-slate-900">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-lg rounded-3xl bg-white shadow-2xl shadow-slate-300/40 border border-slate-200 overflow-hidden">
            <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-900 px-8 py-10 text-white">
                <p class="text-xs uppercase tracking-[0.3em] text-slate-300">Security Center</p>
                <h1 class="mt-2 text-2xl font-semibold">OTP-Verifizierung</h1>
                <p class="mt-3 text-sm text-slate-200">Gib den aktuellen Code aus deinem Authenticator ein.</p>
            </div>
            <div class="px-8 py-8 space-y-4">
                <input type="text" id="otp" maxlength="6" placeholder="123456"
                       class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-center tracking-[0.3em] focus:border-blue-500 focus:ring-blue-500">
                <button onclick="verifyOTP()" class="w-full rounded-2xl bg-blue-600 py-3 text-sm font-semibold text-white shadow-md shadow-blue-200 hover:bg-blue-500">
                    Verifizieren
                </button>
                <p id="result" class="text-sm text-slate-500"></p>
                <div class="flex items-center justify-between text-xs text-slate-500">
                    <span>Zurück zum Login</span>
                    <a href="/login" class="text-blue-600 font-semibold hover:text-blue-500">Anmelden</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
