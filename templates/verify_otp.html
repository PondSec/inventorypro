<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verifizierung | Inventory Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="app-body">
    <div class="auth-shell">
        <header class="auth-header">
            <div class="auth-brand">
                <span class="auth-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11V7a4 4 0 00-8 0v4a2 2 0 002 2h4a2 2 0 002-2z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11h8a4 4 0 014 4v2a4 4 0 01-4 4H8a4 4 0 01-4-4v-2a4 4 0 014-4z" />
                    </svg>
                </span>
                <div>
                    <p class="text-xs uppercase tracking-[0.35em] text-muted">Security</p>
                    <h1 class="text-xl font-semibold">OTP-Verifizierung</h1>
                </div>
            </div>
            <label class="theme-switch" aria-label="Theme umschalten">
                <input type="checkbox" data-theme-toggle>
                <span class="theme-switch__track">
                    <span class="theme-switch__thumb"></span>
                    <span class="theme-switch__icon theme-switch__icon--sun">☀</span>
                    <span class="theme-switch__icon theme-switch__icon--moon">🌙</span>
                </span>
            </label>
        </header>

        <div class="auth-card">
            <p class="section-subtitle">Bitte gib den aktuellen Code aus deinem Authenticator ein.</p>

            <div class="space-y-4 mt-6">
                <input type="text" id="otp" maxlength="6" placeholder="123456"
                       class="input text-center text-lg tracking-widest">
                <button onclick="verifyOTP()" class="btn btn-primary w-full">
                    Verifizieren
                </button>
            </div>

            <p id="result" class="mt-4 text-sm"></p>
        </div>
    </div>

    <script>
        async function verifyOTP() {
            const code = document.getElementById("otp").value;
            const output = document.getElementById("result");

            try {
                const response = await fetch("/api/otp/verify", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({ code: code })
                });

                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }

                const result = await response.json();

                if (response.ok && result.verified) {
                    output.textContent = "✅ Verifiziert!";
                    output.className = "mt-4 text-sm";
                    output.style.color = "var(--success)";
                } else {
                    output.textContent = "❌ Verifizierung fehlgeschlagen!";
                    output.className = "mt-4 text-sm";
                    output.style.color = "var(--danger)";
                }
            } catch (err) {
                output.textContent = "⚠️ Fehler: " + err.message;
                output.className = "mt-4 text-sm";
                output.style.color = "var(--danger)";
            }
        }
    </script>
    <script src="/static/ui.js"></script>
</body>
</html>
