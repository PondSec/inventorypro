<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verifizierung | Inventory Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
    <div class="auth-shell">
        <div class="auth-topbar">
            <a href="/login" class="brand">
                <span class="brand-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v6l4 2M6.75 7.5v10.5a3 3 0 003 3h4.5a3 3 0 003-3V7.5" />
                    </svg>
                </span>
                <div>
                    <p class="text-xs uppercase tracking-[0.3em] text-slate-400">Inventory Pro</p>
                    <p class="text-lg font-semibold">Secure Verify</p>
                </div>
            </a>
            <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">
                <span class="theme-toggle__icon theme-toggle__icon--light">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                    </svg>
                </span>
                <span class="theme-toggle__icon theme-toggle__icon--dark">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
                    </svg>
                </span>
                <span data-theme-label>Dark Mode</span>
            </button>
        </div>

        <div class="auth-card">
            <div class="mb-6">
                <p class="text-xs uppercase tracking-[0.3em] text-slate-400">Security</p>
                <h1 class="text-2xl font-semibold">OTP-Verifizierung</h1>
                <p class="mt-2 text-sm text-slate-500">Bitte gib den aktuellen Code aus deinem Authenticator ein.</p>
            </div>

            <div class="space-y-4">
                <input type="text" id="otp" maxlength="6" placeholder="123456"
                       class="input w-full text-center text-lg tracking-widest">
                <button onclick="verifyOTP()" class="btn btn-primary w-full">
                    Verifizieren
                </button>
            </div>

            <p id="result" class="mt-4 text-sm"></p>
        </div>
    </div>

    <script>
        async function verifyOTP() {
            const code = document.getElementById("otp").value;
            const output = document.getElementById("result");

            try {
                const response = await fetch("/api/otp/verify", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({ code: code })
                });

                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }

                const result = await response.json();

                if (response.ok && result.verified) {
                    output.textContent = "✅ Verifiziert!";
                    output.className = "mt-4 text-sm text-emerald-600";
                } else {
                    output.textContent = "❌ Verifizierung fehlgeschlagen!";
                    output.className = "mt-4 text-sm text-rose-600";
                }
            } catch (err) {
                output.textContent = "⚠️ Fehler: " + err.message;
                output.className = "mt-4 text-sm text-rose-600";
            }
        }
    </script>
    <script src="/static/theme.js"></script>
</body>
</html>
