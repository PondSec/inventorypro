<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Verifizierung | Inventory Pro</title>
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
    <div class="auth-topbar">
        <button type="button" data-theme-toggle onclick="InventoryTheme.toggle()" class="theme-toggle">
            <span data-theme-icon aria-hidden="true">🌙</span>
            <span data-theme-label>Dark Mode</span>
        </button>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <div class="sidebar-logo" aria-hidden="true" data-brand-logo>
                <svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" data-brand-logo-icon fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0-1.657 1.343-3 3-3h2a3 3 0 013 3v4a3 3 0 01-3 3h-2a3 3 0 01-3-3V11z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v4a3 3 0 003 3h5" />
                </svg>
            </div>
            <div>
                <p class="auth-subtitle" data-brand-name>Inventory Pro</p>
                <h1 class="auth-title">Zwei-Faktor-Verifizierung</h1>
            </div>
        </div>

        {% if error %}
            <div class="banner danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" class="stack">
            {% if setup_required %}
            <div class="banner warning" role="alert">
                MFA ist aktiviert. Bitte richten Sie Ihre Authenticator-App ein.
            </div>
            <div class="stack" id="mfa-setup">
                <button type="button" class="btn btn-ghost" id="mfa-setup-button">QR-Code abrufen</button>
                <div class="stack" id="mfa-setup-result" style="display:none;">
                    <img id="mfa-qr" alt="QR Code">
                    <p class="help-text">Secret: <span id="mfa-secret"></span></p>
                </div>
            </div>
            {% endif %}
            <div class="field">
                <label class="label" for="otp">6-stelliger Code</label>
                <input type="text" id="otp" name="otp" autocomplete="one-time-code" required class="input" placeholder="123456">
                <span class="help-text">Geben Sie den Code aus Ihrer Authenticator-App ein.</span>
            </div>
            <button type="submit" class="btn btn-primary">Verifizieren</button>
        </form>

        <div class="stack" style="text-align: center; margin-top: 24px;">
            <a href="/login" class="btn btn-ghost">Zurück zum Login</a>
        </div>
    </div>
    {% if setup_required %}
    <script>
        const button = document.getElementById('mfa-setup-button');
        const result = document.getElementById('mfa-setup-result');
        const qr = document.getElementById('mfa-qr');
        const secret = document.getElementById('mfa-secret');
        if (button) {
            button.addEventListener('click', async () => {
                button.disabled = true;
                button.textContent = 'Lädt...';
                const response = await fetch('/api/otp/setup', { method: 'POST' });
                const data = await response.json();
                if (data.qr_code) {
                    qr.src = data.qr_code;
                    secret.textContent = data.secret || '';
                    result.style.display = 'block';
                }
                button.disabled = false;
                button.textContent = 'QR-Code abrufen';
            });
        }
    </script>
    {% endif %}
</body>
</html>
