<script>
    window.pondsecUiContext = {{ pondsec_ai_ui_context | tojson }};
    if (!window.PONDSEC_AI_CONTEXT) {
        window.PONDSEC_AI_CONTEXT = { type: 'unknown' };
    }
</script>
<div id="pondsec-ai-overlay" class="fixed inset-0 bg-slate-900/40 hidden z-40"></div>
<aside id="pondsec-ai-drawer" class="fixed right-0 top-0 h-full w-full max-w-lg bg-white shadow-2xl border-l border-slate-200 z-50 transform translate-x-full transition-transform">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
        <div>
            <p class="text-xs uppercase tracking-[0.2em] text-slate-400">PondSec AI</p>
            <h2 class="text-lg font-semibold text-slate-900">Ask PondSec AI</h2>
        </div>
        <button type="button" data-pondsec-ai-close class="icon-button text-slate-500 hover:text-slate-900" aria-label="Close">
            ✕
        </button>
    </div>
    <div class="p-6 space-y-4 h-[calc(100%-4rem)] overflow-y-auto">
        <div class="flex flex-wrap gap-2 text-xs text-slate-500" id="pondsec-ai-context">
            <span class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-3 py-1">Kontext: <span id="pondsec-ai-context-text"></span></span>
        </div>
        <div id="pondsec-ai-selection" class="rounded-2xl border border-slate-200 bg-slate-50 p-4 space-y-2 hidden">
            <p class="text-xs font-semibold text-slate-600">Ticket auswählen</p>
            <div class="flex items-center gap-2">
                <input id="pondsec-ai-select-ticket" type="number" min="1" class="w-24 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm" placeholder="#ID">
                <button type="button" id="pondsec-ai-select-ticket-btn" class="rounded-xl bg-indigo-600 px-3 py-2 text-xs font-semibold text-white hover:bg-indigo-500">Auswählen</button>
            </div>
            <p class="text-xs text-slate-500">Tipp: Alternativ kannst du im Text „ticket #123“ angeben.</p>
        </div>
        <div>
            <label class="text-xs font-semibold text-slate-500">Nachricht</label>
            <textarea id="pondsec-ai-input" rows="4" class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Wie kann PondSec AI helfen?"></textarea>
            <div class="mt-3 flex items-center gap-2">
                <button type="button" id="pondsec-ai-send" class="rounded-2xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">Senden</button>
                <span id="pondsec-ai-status" class="text-xs text-slate-500"></span>
            </div>
        </div>
        <div>
            <h3 class="text-sm font-semibold text-slate-700">Insights</h3>
            <p id="pondsec-ai-insights" class="mt-2 text-sm text-slate-600">Noch keine Antwort.</p>
        </div>
        <div>
            <h3 class="text-sm font-semibold text-slate-700">Vorgeschlagene Aktionen</h3>
            <div id="pondsec-ai-actions" class="mt-3 space-y-3"></div>
        </div>
    </div>
</aside>
<script>
(() => {
    const drawer = document.getElementById('pondsec-ai-drawer');
    const overlay = document.getElementById('pondsec-ai-overlay');
    const input = document.getElementById('pondsec-ai-input');
    const sendBtn = document.getElementById('pondsec-ai-send');
    const statusEl = document.getElementById('pondsec-ai-status');
    const insightsEl = document.getElementById('pondsec-ai-insights');
    const actionsEl = document.getElementById('pondsec-ai-actions');
    const contextText = document.getElementById('pondsec-ai-context-text');
    const selectionPanel = document.getElementById('pondsec-ai-selection');
    const selectTicketInput = document.getElementById('pondsec-ai-select-ticket');
    const selectTicketBtn = document.getElementById('pondsec-ai-select-ticket-btn');
    const openButtons = document.querySelectorAll('[data-pondsec-ai-open]');
    const closeButtons = document.querySelectorAll('[data-pondsec-ai-close]');

    const permissions = window.inventoryPermissions || [];
    const isApprover = (window.inventoryIsSuperuser || false) || permissions.includes('ai.approve');

    function setContext() {
        const ctx = window.PONDSEC_AI_CONTEXT || { type: 'unknown' };
        if (ctx.type === 'ticket' && ctx.id) {
            contextText.textContent = `ticket #${ctx.id}`;
        } else {
            contextText.textContent = ctx.type || 'unknown';
        }
        if (selectionPanel) {
            const showSelection = ctx.type === 'tickets' && !ctx.id;
            selectionPanel.classList.toggle('hidden', !showSelection);
        }
    }

    function openDrawer() {
        drawer.classList.remove('translate-x-full');
        overlay.classList.remove('hidden');
        setContext();
    }

    function closeDrawer() {
        drawer.classList.add('translate-x-full');
        overlay.classList.add('hidden');
    }

    openButtons.forEach(btn => btn.addEventListener('click', openDrawer));
    closeButtons.forEach(btn => btn.addEventListener('click', closeDrawer));
    overlay.addEventListener('click', closeDrawer);

    async function sendMessage() {
        const message = input.value.trim();
        if (!message) {
            statusEl.textContent = 'Bitte eine Nachricht eingeben.';
            return;
        }
        statusEl.textContent = 'Sende...';
        actionsEl.innerHTML = '';
        try {
            const response = await fetch('/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({
                    message,
                    context: window.PONDSEC_AI_CONTEXT || { type: 'unknown' }
                })
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Fehler bei der Anfrage');
            }
            insightsEl.textContent = data.insights || 'Keine Insights.';
            renderActions(data.proposed_actions || []);
            statusEl.textContent = 'Antwort erhalten.';
        } catch (error) {
            statusEl.textContent = error.message || 'Fehler';
        }
    }

    function renderActions(actions) {
        actionsEl.innerHTML = '';
        if (!actions.length) {
            actionsEl.innerHTML = '<p class="text-sm text-slate-500">Keine Aktionen vorgeschlagen.</p>';
            return;
        }
        actions.forEach(action => {
            const card = document.createElement('div');
            card.className = 'rounded-2xl border border-slate-200 bg-slate-50 p-4 space-y-2';
            const title = document.createElement('h4');
            title.className = 'text-sm font-semibold text-slate-800';
            title.textContent = action.title || 'Aktion';
            const meta = document.createElement('p');
            meta.className = 'text-xs text-slate-500';
            meta.textContent = `Risiko: ${action.risk || 'low'} • Status: ${action.status || 'proposed'}`;
            const rationale = document.createElement('p');
            rationale.className = 'text-xs text-slate-500';
            rationale.textContent = action.rationale || '';
            const btnRow = document.createElement('div');
            btnRow.className = 'flex flex-wrap gap-2';
            if (action.requires_approval) {
                if (isApprover) {
                    const approveBtn = document.createElement('button');
                    approveBtn.className = 'rounded-full bg-emerald-600 px-3 py-1 text-xs font-semibold text-white';
                    approveBtn.textContent = 'Approve';
                    approveBtn.onclick = () => updateApproval(action.action_id, 'approve');
                    const rejectBtn = document.createElement('button');
                    rejectBtn.className = 'rounded-full bg-rose-600 px-3 py-1 text-xs font-semibold text-white';
                    rejectBtn.textContent = 'Reject';
                    rejectBtn.onclick = () => updateApproval(action.action_id, 'reject');
                    btnRow.appendChild(approveBtn);
                    btnRow.appendChild(rejectBtn);
                } else {
                    const label = document.createElement('span');
                    label.className = 'text-xs text-amber-600';
                    label.textContent = 'Approval erforderlich';
                    btnRow.appendChild(label);
                }
            }
            card.appendChild(title);
            card.appendChild(meta);
            if (rationale.textContent) {
                card.appendChild(rationale);
            }
            if (btnRow.children.length) {
                card.appendChild(btnRow);
            }
            actionsEl.appendChild(card);
        });
    }

    async function updateApproval(actionId, action) {
        if (!actionId) {
            return;
        }
        statusEl.textContent = 'Speichere Entscheidung...';
        const response = await fetch(`/ai/actions/${actionId}/${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin'
        });
        const data = await response.json();
        if (!response.ok) {
            statusEl.textContent = data.error || 'Fehler';
            return;
        }
        statusEl.textContent = 'Aktion aktualisiert.';
    }

    if (sendBtn) {
        sendBtn.addEventListener('click', sendMessage);
    }
    if (selectTicketBtn) {
        selectTicketBtn.addEventListener('click', () => {
            const value = Number(selectTicketInput?.value || 0);
            if (!value) {
                return;
            }
            window.PONDSEC_AI_CONTEXT = { type: 'ticket', id: value };
            setContext();
        });
    }
})();
</script>
