<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFA einrichten | Inventory Pro</title>
    <script src="/static/theme.js?v=inventory-v4-20260726-1"></script>
    <script src="/static/csrf.js?v=1"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
    <div class="auth-topbar">
        <button type="button" data-theme-toggle onclick="InventoryTheme.toggle()" class="theme-toggle">
            <span data-theme-icon aria-hidden="true">🌙</span>
            <span data-theme-label>Dark Mode</span>
        </button>
    </div>

    <main class="auth-card">
        <div class="auth-header">
            <div class="sidebar-logo" aria-hidden="true" data-brand-logo>
                <svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" data-brand-logo-icon fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0-1.657 1.343-3 3-3h2a3 3 0 013 3v4a3 3 0 01-3 3h-2a3 3 0 01-3-3V11z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v4a3 3 0 003 3h5" />
                </svg>
            </div>
            <div>
                <p class="auth-subtitle" data-brand-name>Inventory Pro</p>
                <h1 class="auth-title">MFA einrichten</h1>
            </div>
        </div>

        <p class="help-text">Für dieses Konto ist Mehrfaktor-Authentifizierung erforderlich. Scanne den QR-Code und bestätige die Einrichtung mit einem aktuellen Code.</p>
        <div id="mfa-error" class="banner danger" role="alert" hidden></div>
        <div id="mfa-setup" class="stack" hidden>
            <img id="mfa-qr-code" alt="QR-Code für TOTP-Einrichtung" class="mx-auto max-w-full">
            <div class="field">
                <label class="label" for="mfa-secret">Alternativer Einrichtungsschlüssel</label>
                <input id="mfa-secret" class="input" type="text" readonly>
            </div>
            <form id="mfa-confirm-form" class="stack">
                <div class="field">
                    <label class="label" for="mfa-code">6-stelliger Bestätigungscode</label>
                    <input id="mfa-code" class="input" type="text" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" required placeholder="123456">
                    <span class="help-text">Erst nach erfolgreicher Prüfung wird MFA für das Konto aktiviert.</span>
                </div>
                <button type="submit" class="btn btn-primary">MFA jetzt aktivieren</button>
            </form>
        </div>
    </main>

    <script>
        (() => {
            const error = document.getElementById('mfa-error');
            const setup = document.getElementById('mfa-setup');
            const qrCode = document.getElementById('mfa-qr-code');
            const secret = document.getElementById('mfa-secret');
            const form = document.getElementById('mfa-confirm-form');
            const code = document.getElementById('mfa-code');

            function showError(message) {
                error.textContent = message;
                error.hidden = false;
            }

            async function startEnrollment() {
                const response = await fetch('/api/otp/setup', { method: 'POST', credentials: 'include' });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'MFA-Einrichtung konnte nicht gestartet werden.');
                }
                if (data.enabled) {
                    window.location.assign('/verify');
                    return;
                }
                qrCode.src = data.qr_code;
                secret.value = data.secret;
                setup.hidden = false;
                code.focus();
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                error.hidden = true;
                const response = await fetch('/api/otp/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ code: code.value.trim() })
                });
                const data = await response.json();
                if (!response.ok) {
                    showError(data.error || 'Der Code konnte nicht bestätigt werden.');
                    return;
                }
                window.location.assign('/');
            });

            startEnrollment().catch((exception) => showError(exception.message));
        })();
    </script>
</body>
</html>
