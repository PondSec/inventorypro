<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Passwort zurücksetzen | Inventory Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950/5 text-slate-900">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-lg rounded-3xl bg-white shadow-2xl shadow-slate-300/40 border border-slate-200 overflow-hidden">
            <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-900 px-8 py-10 text-white">
                <p class="text-xs uppercase tracking-[0.3em] text-slate-300">Security Center</p>
                <h1 class="mt-2 text-2xl font-semibold">Passwort zurücksetzen</h1>
                <p class="mt-3 text-sm text-slate-200">Verifiziere dich mit deinem OTP-Code, um ein neues Passwort zu vergeben.</p>
            </div>
            <div class="px-8 py-8 space-y-6">
                {% if error %}
                <div class="rounded-2xl bg-rose-50 border border-rose-100 px-4 py-3 text-sm text-rose-600">{{ error }}</div>
                {% elif success %}
                <div class="rounded-2xl bg-emerald-50 border border-emerald-100 px-4 py-3 text-sm text-emerald-600">{{ success }}</div>
                {% endif %}
                <form method="POST" action="/reset" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Benutzername</label>
                        <input type="text" name="username" required
                               class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">OTP-Code</label>
                        <input type="text" name="otp" maxlength="6" required
                               class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Neues Passwort</label>
                        <input type="password" name="new_password" required
                               class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <button type="submit" class="w-full rounded-2xl bg-blue-600 py-3 text-sm font-semibold text-white shadow-md shadow-blue-200 hover:bg-blue-500">
                        Passwort aktualisieren
                    </button>
                </form>
                <div class="flex items-center justify-between text-xs text-slate-500">
                    <span>Zurück zum Login</span>
                    <a href="/login" class="text-blue-600 font-semibold hover:text-blue-500">Anmelden</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
