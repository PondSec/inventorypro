<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen | Inventory Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="app-body">
    <div class="auth-shell">
        <header class="auth-header">
            <div class="auth-brand">
                <span class="auth-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11V7a4 4 0 00-8 0v4a2 2 0 002 2h4a2 2 0 002-2z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11h8a4 4 0 014 4v2a4 4 0 01-4 4H8a4 4 0 01-4-4v-2a4 4 0 014-4z" />
                    </svg>
                </span>
                <div>
                    <p class="text-xs uppercase tracking-[0.35em] text-muted">Security</p>
                    <h1 class="text-xl font-semibold">Passwort zurücksetzen</h1>
                </div>
            </div>
            <label class="theme-switch" aria-label="Theme umschalten">
                <input type="checkbox" data-theme-toggle>
                <span class="theme-switch__track">
                    <span class="theme-switch__thumb"></span>
                    <span class="theme-switch__icon theme-switch__icon--sun">☀</span>
                    <span class="theme-switch__icon theme-switch__icon--moon">🌙</span>
                </span>
            </label>
        </header>

        <div class="auth-card">
            <p class="section-subtitle">Gib deinen Benutzernamen und den 2FA-Code ein.</p>

            <form method="POST" action="/reset" class="space-y-4 mt-6">
                <div>
                    <label class="label">Benutzername</label>
                    <input type="text" name="username" required class="input mt-2">
                </div>
                <div>
                    <label class="label">OTP-Code</label>
                    <input type="text" name="otp" maxlength="6" required
                           class="input mt-2"
                           placeholder="123456">
                </div>
                <div>
                    <label class="label">Neues Passwort</label>
                    <input type="password" name="new_password" required class="input mt-2">
                </div>
                <button type="submit" class="btn btn-primary w-full">
                    Zurücksetzen
                </button>
            </form>

            {% if error %}
                <p class="alert alert--error mt-4">{{ error }}</p>
            {% elif success %}
                <p class="alert alert--success mt-4">{{ success }}</p>
            {% endif %}

            <div class="mt-6 text-center">
                <a href="/login" class="text-sm font-semibold text-muted hover:text-[color:var(--accent)]">Zurück zum Login</a>
            </div>
        </div>
    </div>
    <script src="/static/ui.js"></script>
</body>
</html>
