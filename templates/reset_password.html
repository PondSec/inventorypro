<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen | Inventory Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
    <div class="auth-shell">
        <div class="auth-topbar">
            <a href="/login" class="brand">
                <span class="brand-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v6l4 2M6.75 7.5v10.5a3 3 0 003 3h4.5a3 3 0 003-3V7.5" />
                    </svg>
                </span>
                <div>
                    <p class="text-xs uppercase tracking-[0.3em] text-slate-400">Inventory Pro</p>
                    <p class="text-lg font-semibold">Security Center</p>
                </div>
            </a>
            <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">
                <span class="theme-toggle__icon theme-toggle__icon--light">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                    </svg>
                </span>
                <span class="theme-toggle__icon theme-toggle__icon--dark">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
                    </svg>
                </span>
                <span data-theme-label>Dark Mode</span>
            </button>
        </div>

        <div class="auth-card">
            <div class="mb-6">
                <p class="text-xs uppercase tracking-[0.3em] text-slate-400">Security</p>
                <h1 class="text-2xl font-semibold">Passwort zurücksetzen</h1>
                <p class="mt-2 text-sm text-slate-500">Gib deinen Benutzernamen und den 2FA-Code ein.</p>
            </div>

            <form method="POST" action="/reset" class="space-y-4">
                <div>
                    <label class="text-sm font-semibold text-slate-700">Benutzername</label>
                    <input type="text" name="username" required
                           class="input mt-2 w-full">
                </div>
                <div>
                    <label class="text-sm font-semibold text-slate-700">OTP-Code</label>
                    <input type="text" name="otp" maxlength="6" required
                           class="input mt-2 w-full"
                           placeholder="123456">
                </div>
                <div>
                    <label class="text-sm font-semibold text-slate-700">Neues Passwort</label>
                    <input type="password" name="new_password" required
                           class="input mt-2 w-full">
                </div>
                <button type="submit" class="btn btn-primary w-full">
                    Zurücksetzen
                </button>
            </form>

            {% if error %}
                <p class="mt-4 rounded-2xl border border-rose-100 bg-rose-50 px-4 py-3 text-sm text-rose-600">{{ error }}</p>
            {% elif success %}
                <p class="mt-4 rounded-2xl border border-emerald-100 bg-emerald-50/70 px-4 py-3 text-sm text-emerald-700">{{ success }}</p>
            {% endif %}

            <div class="mt-6 text-center">
                <a href="/login" class="text-sm font-semibold text-blue-600 hover:text-blue-500">Zurück zum Login</a>
            </div>
        </div>
    </div>

    <script src="/static/theme.js"></script>
</body>
</html>
