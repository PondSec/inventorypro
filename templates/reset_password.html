<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen | Inventory Pro</title>
    <script src="/static/theme.js"></script>
    <script src="/static/csrf.js?v=1"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
    <div class="auth-topbar">
        <button type="button" data-theme-toggle onclick="InventoryTheme.toggle()" class="theme-toggle">
            <span data-theme-icon aria-hidden="true">🌙</span>
            <span data-theme-label>Dark Mode</span>
        </button>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <div class="sidebar-logo" aria-hidden="true" data-brand-logo>
                <svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" data-brand-logo-icon fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0-1.657 1.343-3 3-3h2a3 3 0 013 3v4a3 3 0 01-3 3h-2a3 3 0 01-3-3V11z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v4a3 3 0 003 3h5" />
                </svg>
            </div>
            <div>
                <p class="auth-subtitle" data-brand-name>Inventory Pro</p>
                <h1 class="auth-title">Passwort zurücksetzen</h1>
            </div>
        </div>

        {% if message %}
            <div class="banner" role="status">{{ message }}</div>
        {% endif %}
        {% if error %}
            <div class="banner danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" class="stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="field">
                <label class="label" for="username">Benutzername</label>
                <input type="text" id="username" name="username" autocomplete="username" required class="input" placeholder="Benutzername">
            </div>
            <div class="field">
                <label class="label" for="otp">TOTP-Code</label>
                <input type="text" id="otp" name="otp" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" required class="input" placeholder="123456">
                <span class="help-text">Bestätige den Reset mit dem aktuellen Code aus deiner Authenticator-App.</span>
            </div>
            <div class="field">
                <label class="label" for="new_password">Neues Passwort</label>
                <input type="password" id="new_password" name="new_password" autocomplete="new-password" required class="input" placeholder="Neues Passwort">
            </div>
            <div class="field">
                <label class="label" for="password_confirmation">Neues Passwort wiederholen</label>
                <input type="password" id="password_confirmation" name="password_confirmation" autocomplete="new-password" required class="input" placeholder="Neues Passwort wiederholen">
            </div>
            <button type="submit" class="btn btn-primary">Passwort mit TOTP zurücksetzen</button>
        </form>

        <div class="stack" style="text-align: center; margin-top: 24px;">
            <a href="/login" class="btn btn-ghost">Zurück zum Login</a>
        </div>
    </div>
</body>
</html>
