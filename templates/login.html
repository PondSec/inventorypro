<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Inventory Pro</title>
    <script src="/static/theme.js?v=inventory-v4-20260726-1"></script>
    <script src="/static/csrf.js?v=1"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
    <div class="auth-topbar">
        <button type="button" data-theme-toggle onclick="InventoryTheme.toggle()" class="theme-toggle">
            <span data-theme-icon aria-hidden="true">🌙</span>
            <span data-theme-label>Dark Mode</span>
        </button>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <div class="sidebar-logo" aria-hidden="true" data-brand-logo>
                <svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" data-brand-logo-icon fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 3v2.25M14.25 3v2.25M5.25 7.5h13.5M6.75 7.5v10.5a3 3 0 003 3h4.5a3 3 0 003-3V7.5" />
                </svg>
            </div>
            <div>
                <p class="auth-subtitle" data-brand-name>Inventory Pro</p>
                <h1 class="auth-title">Willkommen zurück</h1>
            </div>
        </div>

        {% if error %}
            <div class="banner danger" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" class="stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="field">
                <label class="label" for="username">Benutzername</label>
                <input type="text" id="username" name="username" autocomplete="username" inputmode="text" required
                       class="input" placeholder="Benutzername oder E-Mail">
            </div>
            <div class="field">
                <label class="label" for="password">Passwort</label>
                <div class="inline-actions">
                    <input type="password" name="password" id="password" autocomplete="current-password" inputmode="text" required
                           class="input" placeholder="Passwort">
                    <button type="button" class="btn btn-ghost" onclick="togglePassword()">Anzeigen</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Anmelden</button>
        </form>

        <div class="stack" style="text-align: center; margin-top: 24px;">
            <a href="/reset" class="btn btn-ghost">Passwort vergessen?</a>
            <p class="help-text">Powered by PondSec</p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
