<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Inventory Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="app-body">
    <div class="auth-shell">
        <header class="auth-header">
            <div class="auth-brand">
                <span class="auth-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 3v2.25M14.25 3v2.25M5.25 7.5h13.5M6.75 7.5v10.5a3 3 0 003 3h4.5a3 3 0 003-3V7.5" />
                    </svg>
                </span>
                <div>
                    <p class="text-xs uppercase tracking-[0.35em] text-muted">Inventory Pro</p>
                    <h1 class="text-xl font-semibold">Willkommen zurück</h1>
                </div>
            </div>
            <label class="theme-switch" aria-label="Theme umschalten">
                <input type="checkbox" data-theme-toggle>
                <span class="theme-switch__track">
                    <span class="theme-switch__thumb"></span>
                    <span class="theme-switch__icon theme-switch__icon--sun">☀</span>
                    <span class="theme-switch__icon theme-switch__icon--moon">🌙</span>
                </span>
            </label>
        </header>

        <div class="auth-card">
            {% if error %}
                <div class="alert alert--error mb-4">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" class="space-y-4">
                <div>
                    <label class="label">Benutzername</label>
                    <input type="text" name="username" autocomplete="username" required
                           class="input mt-2"
                           placeholder="Benutzername oder E-Mail">
                </div>
                <div>
                    <label class="label">Passwort</label>
                    <div class="relative mt-2">
                        <input type="password" name="password" id="password" autocomplete="current-password" required
                               class="input pr-16"
                               placeholder="Passwort">
                        <button type="button" class="btn btn-ghost btn-sm absolute right-2 top-1/2 -translate-y-1/2" onclick="togglePassword()">
                            Anzeigen
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-full">
                    Anmelden
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/reset" class="text-sm font-semibold text-muted hover:text-[color:var(--accent)]">Passwort vergessen?</a>
            </div>
        </div>

        <p class="auth-footer">Powered by PondSec</p>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
    <script src="/static/ui.js"></script>
</body>
</html>
