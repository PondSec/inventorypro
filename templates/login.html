<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Inventory Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950/5 text-slate-900">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-lg rounded-3xl bg-white shadow-2xl shadow-slate-300/40 border border-slate-200 overflow-hidden">
            <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-900 px-8 py-10 text-white">
                <div class="flex items-center gap-3">
                    <div class="flex items-center justify-center w-12 h-12 rounded-2xl bg-white/10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L6 13.25l3.75-3.75M14.25 7L18 10.75 14.25 14.5" />
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs uppercase tracking-[0.3em] text-slate-300">Inventory Pro</p>
                        <h1 class="text-2xl font-semibold">Willkommen zurück</h1>
                    </div>
                </div>
                <p class="mt-4 text-sm text-slate-200">Melde dich an, um deine Assets, Kategorien und Dashboards zu verwalten.</p>
            </div>
            <div class="px-8 py-8 space-y-6">
                {% if error %}
                <div class="rounded-2xl bg-rose-50 border border-rose-100 px-4 py-3 text-sm text-rose-600">{{ error }}</div>
                {% endif %}
                <form method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Benutzername</label>
                        <input name="username" type="text" required
                               class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-blue-500 focus:ring-blue-500"
                               placeholder="z. B. admin">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Passwort</label>
                        <input name="password" type="password" required
                               class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-blue-500 focus:ring-blue-500"
                               placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full rounded-2xl bg-blue-600 py-3 text-sm font-semibold text-white shadow-md shadow-blue-200 hover:bg-blue-500">
                        Anmelden
                    </button>
                </form>
                <div class="flex items-center justify-between text-xs text-slate-500">
                    <span>2FA &amp; Passworthilfe</span>
                    <a href="/reset" class="text-blue-600 font-semibold hover:text-blue-500">Passwort zurücksetzen</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
