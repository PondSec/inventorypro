<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Inventory Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
    <div class="auth-shell">
        <div class="auth-topbar">
            <a href="/login" class="brand">
                <span class="brand-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 3v2.25M14.25 3v2.25M5.25 7.5h13.5M6.75 7.5v10.5a3 3 0 003 3h4.5a3 3 0 003-3V7.5" />
                    </svg>
                </span>
                <div>
                    <p class="text-xs uppercase tracking-[0.3em] text-slate-400">Inventory Pro</p>
                    <p class="text-lg font-semibold">Sign-in Portal</p>
                </div>
            </a>
            <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">
                <span class="theme-toggle__icon theme-toggle__icon--light">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                    </svg>
                </span>
                <span class="theme-toggle__icon theme-toggle__icon--dark">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
                    </svg>
                </span>
                <span data-theme-label>Dark Mode</span>
            </button>
        </div>

        <div class="auth-card">
            <div class="flex items-center gap-3 mb-6">
                <div>
                    <p class="text-xs uppercase tracking-[0.3em] text-slate-400">Inventory Pro</p>
                    <h1 class="text-2xl font-semibold">Willkommen zurück</h1>
                    <p class="helper-text">Melde dich an, um dein Inventar zu verwalten.</p>
                </div>
            </div>

            {% if error %}
                <div class="mb-4 rounded-2xl border border-rose-100 bg-rose-50 px-4 py-3 text-sm text-rose-600">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" class="space-y-4">
                <div>
                    <label class="text-sm font-semibold text-slate-700">Benutzername</label>
                    <input type="text" name="username" autocomplete="username" required
                           class="input mt-2 w-full"
                           placeholder="Benutzername oder E-Mail">
                </div>
                <div>
                    <label class="text-sm font-semibold text-slate-700">Passwort</label>
                    <div class="relative mt-2">
                        <input type="password" name="password" id="password" autocomplete="current-password" required
                               class="input w-full pr-12"
                               placeholder="Passwort">
                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-slate-500" onclick="togglePassword()">
                            Anzeigen
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-full">
                    Anmelden
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/reset" class="text-sm font-semibold text-blue-600 hover:text-blue-500">Passwort vergessen?</a>
            </div>
        </div>

        <p class="auth-footer">Powered by PondSec</p>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
    <script src="/static/theme.js"></script>
</body>
</html>
