<dialog class="ui-dialog packing-viewer binpacking-modal-panel" x-ref="packingDialog" aria-labelledby="packing-viewer-title">
    <header><div><h2 id="packing-viewer-title">3D-Ansicht</h2><p x-text="planName || containerName"></p></div><button type="button" class="icon-button" @click="close3d()" aria-label="3D-Ansicht schließen" autofocus>{{ icon('x') }}</button></header>
    <p class="muted" x-text="preview?.message"></p>
    <div class="packing-viewer-toolbar" role="group" aria-label="Kameraansicht">
        {% for camera,label in [('iso','3D'),('front','Front'),('side','Seite'),('top','Oben')] %}<button class="btn btn-secondary" type="button" @click="setBinpackingCamera('{{ camera }}')" :aria-pressed="binpackingPreviewCamera === '{{ camera }}'">{{ ui_t(label) }}</button>{% endfor %}
        <button class="btn btn-secondary" type="button" @click="binpackingRotationZ-=15; binpackingPreviewCamera='custom'" aria-label="Ansicht nach links drehen">{{ icon('rotate-ccw') }}</button><button class="btn btn-secondary" type="button" @click="binpackingRotationZ+=15; binpackingPreviewCamera='custom'" aria-label="Ansicht nach rechts drehen">{{ icon('rotate-cw') }}</button>
    </div>
    <div class="packing-viewer-content">
        <div class="packing-viewer-steps" role="group" aria-label="Einräumfolge"><template x-for="step in (preview?.steps || [])" :key="step.step"><button class="btn btn-secondary" type="button" @click="focusBinpackingStep(step)" :aria-pressed="isBinpackingStepActive(step)"><span x-text="step.step"></span><span x-text="step.asset_name"></span></button></template><p x-show="!preview?.placed_count">Keine Gegenstände eingeplant.</p></div>
        <div class="binpacking-scene" @pointerdown="startBinpacking3dDrag($event)" @pointermove="dragBinpacking3dView($event)" @pointerup="endBinpacking3dDrag($event)" @pointercancel="endBinpacking3dDrag($event)">
            <svg width="1000" height="620" class="binpacking-scene__svg" :viewBox="binpackingSceneViewBox()" role="img" aria-label="3D Regalvorschau" x-html="binpackingSceneMarkup(preview)" @click.stop="handleBinpackingSceneEvent($event)" @keydown.enter.prevent="handleBinpackingSceneEvent($event)" @keydown.space.prevent="handleBinpackingSceneEvent($event)"></svg>
        </div>
    </div>
    <p class="packing-viewer-current" role="status"><strong x-text="currentBinpackingActiveStep()?.asset_name"></strong><span x-text="currentBinpackingActiveStep()?.coordinate_label"></span></p>
    <p class="muted">Ziehen dreht die Ansicht. Wählen Sie einen Gegenstand oder einen Schritt, um seine Position hervorzuheben.</p>
</dialog>
