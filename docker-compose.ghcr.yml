services:
  inventorypro:
    image: ghcr.io/pondsec/inventorypro:${INVENTORYPRO_VERSION:-v0.1.3}
    container_name: inventorypro
    ports:
      - "${INVENTORY_HTTP_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      INVENTORY_HOST: 0.0.0.0
      INVENTORY_PORT: 5000
      INVENTORY_DATABASE_PATH: /data/inventory.db
      INVENTORY_UPLOADS_DIR: /data/uploads
      INVENTORY_INSTANCE_PATH: /data/instance
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - inventorypro-data:/data
    restart: unless-stopped

volumes:
  inventorypro-data:
    name: inventorypro-data
